[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-gate"
version = "0.3.0"
description = "Pre-execution hook for Codex CLI, Claude Code and Gemini CLI that blocks tool calls carrying national IDs, IBANs, card numbers, secrets, upload commands or PII-selecting SQL."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sdursun1979" }]
keywords = ["pii", "gdpr", "kvkk", "hipaa", "privacy", "data-protection", "guardrail", "codex", "claude-code", "gemini-cli", "hooks", "ai-agents", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sdursun1979/pii-gate"
Issues = "https://github.com/sdursun1979/pii-gate/issues"
Changelog = "https://github.com/sdursun1979/pii-gate/blob/main/CHANGELOG.md"

[project.scripts]
pii-gate = "pii_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
